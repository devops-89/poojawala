<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add New Address</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #1a1a1f; --muted: #6b7280; --line: #d1d5db; --bg: #eceef0;
    --accent: #f26a00; --accent-dark: #d45b00; --green: #1f8a3b; --greenbg: #e4f5e8; --error: #c0261b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); padding: 24px 12px 48px; }
  .card { background: #fff; border-radius: 22px; max-width: 760px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.12); overflow: hidden; }
  .card > header { padding: 24px 30px 16px; border-bottom: 1px solid #e5e7eb; }
  .card > header h1 { margin: 0; font-size: 1.45rem; }
  .body { padding: 20px 30px; display: flex; flex-direction: column; gap: 18px; }
  .loc-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    background: var(--greenbg); color: var(--green); border: 1px solid #bfe3c8; border-radius: 10px;
    padding: 16px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .loc-btn:hover { background: #d7efdd; }
  .loc-btn:disabled { opacity: .7; cursor: wait; }
  .field { position: relative; }
  .field input[type=text], .field textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 18px 14px 8px; border: 1.5px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); resize: vertical;
  }
  .field textarea { min-height: 96px; }
  .field label {
    position: absolute; left: 14px; top: 16px; color: var(--muted); font-size: 1rem; pointer-events: none;
    transition: all .15s; background: transparent; padding: 0 4px;
  }
  .field input:focus + label, .field input:not(:placeholder-shown) + label,
  .field textarea:focus + label, .field textarea:not(:placeholder-shown) + label {
    top: -9px; left: 12px; font-size: .75rem; background: #fff;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field input:focus + label, .field textarea:focus + label { color: var(--accent); }
  .field.err input, .field.err textarea { border-color: var(--error); }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field.coord input { background: #fafafa; font-variant-numeric: tabular-nums; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: -8px; }
  .statusrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .status { font-size: .88rem; color: var(--muted); min-height: 1.2em; flex: 1; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--green); }
  .findbtn { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .findbtn:hover { background: #fff3e8; }
  #map { height: 280px; border-radius: 12px; border: 1px solid var(--line); z-index: 0; }
  .check { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .card > footer { border-top: 1px solid #e5e7eb; padding: 18px 30px; display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
  .reset { margin-right: auto; background: #fff; color: #475569; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  .reset:hover { background: #f3f4f6; }
  .cancel { background: none; border: 0; color: #475569; font: inherit; font-weight: 700; cursor: pointer; }
  .save { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 14px 26px; font: inherit; font-weight: 700; cursor: pointer; }
  .save:hover { background: var(--accent-dark); }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffd2ab; outline-offset: 2px; }
  #suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 2000; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 260px; overflow-y: auto; display: none; }
  #suggest.show { display: block; }
  #suggest button { display: block; width: 100%; text-align: left; background: #fff; border: 0; border-bottom: 1px solid #f0f0f0; padding: 10px 12px; font: inherit; cursor: pointer; }
  #suggest button:hover, #suggest button.active { background: #fff3e8; }
  #suggest .t { font-weight: 600; font-size: .95rem; } #suggest .s { font-size: .82rem; color: var(--muted); }

  .saved { max-width: 760px; margin: 28px auto 0; }
  .saved h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .addr { background: #fff; border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .addr b { font-size: 1rem; } .addr .tag { background: var(--accent); color: #fff; font-size: .72rem; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
  .addr p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.4; }
  .addr .ll { font-variant-numeric: tabular-nums; color: var(--ink); }
  .addr button { background: #fde8e8; color: var(--error); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; font-size: .85rem; }
  pre { background: #11181c; color: #cfe8e4; padding: 14px; border-radius: 10px; overflow-x: auto; font-size: .82rem; }
  @media (max-width: 600px) { .row3 { grid-template-columns: 1fr; } .row2 { grid-template-columns: 1fr; } .body, .card > header, .card > footer { padding-left: 18px; padding-right: 18px; } }
</style>
</head>
<body>

<div class="card">
  <header><h1>Add New Address</h1></header>

  <div class="body">
    <button type="button" class="loc-btn" id="locBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
      Use Current Location Coordinates
    </button>

    <div class="field" id="f-label">
      <input type="text" id="label" placeholder=" " value="Home">
      <label for="label">Address Label (e.g., Home, Office) *</label>
    </div>

    <div class="field" id="f-address">
      <textarea id="address" placeholder=" " autocomplete="off"></textarea>
      <label for="address">Full Address *</label>
      <div id="suggest" role="listbox"></div>
    </div>
    <div class="hint">Fill any one of address, city or pincode. The map marker, latitude, longitude and the other fields fill in automatically.</div>

    <div class="row3">
      <div class="field" id="f-city"><input type="text" id="city" placeholder=" "><label for="city">City *</label></div>
      <div class="field" id="f-state"><input type="text" id="state" placeholder=" "><label for="state">State *</label></div>
      <div class="field" id="f-pin"><input type="text" id="pin" placeholder=" " inputmode="numeric" maxlength="6"><label for="pin">Pincode *</label></div>
    </div>

    <div class="row2">
      <div class="field coord" id="f-lat"><input type="text" id="lat" placeholder=" " inputmode="decimal"><label for="lat">Latitude *</label></div>
      <div class="field coord" id="f-lng"><input type="text" id="lng" placeholder=" " inputmode="decimal"><label for="lng">Longitude *</label></div>
    </div>

    <div class="statusrow">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <button type="button" class="findbtn" id="findBtn">Find location from these details</button>
    </div>

    <div id="map" aria-label="Pick location on map"></div>
    <div class="hint">Click the map or drag the marker to set the exact spot. The address fields update to match.</div>

    <label class="check"><input type="checkbox" id="isDefault"> Set as default address</label>
  </div>

  <footer>
    <button type="button" class="reset" id="reset">Reset</button>
    <button type="button" class="cancel" id="cancel">Cancel</button>
    <button type="button" class="save" id="save">Save Address</button>
  </footer>
</div>

<div class="saved" id="savedWrap" style="display:none">
  <h2>Saved addresses</h2>
  <div id="savedList"></div>
  <details><summary style="cursor:pointer;margin:8px 0">JSON (what you would send to your backend)</summary><pre id="json"></pre></details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let saved = [];
try { saved = JSON.parse(localStorage.getItem('addresses') || '[]'); } catch (e) {}

// exact = the person chose an exact point (current location, suggestion, map click/drag, typed lat/long).
// While exact is false, typing a pincode/city/address keeps moving the marker to the best match.
let exact = false;

// ---------- Map ----------
const map = L.map('map').setView([22.9734, 78.6569], 5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors'
}).addTo(map);
let marker = null;

function setStatus(msg, kind = '') { const s = $('status'); s.textContent = msg; s.className = 'status ' + kind; }
function clearErr(id) { const el = $(id); if (el) el.classList.remove('err'); }
function markErr(id) { $(id).classList.add('err'); }

function placeMarker(lat, lng, zoom) {
  if (!marker) {
    marker = L.marker([lat, lng], { draggable: true }).addTo(map);
    marker.on('dragend', () => {
      const p = marker.getLatLng(); exact = true; geoId++;
      setCoords(p.lat, p.lng); reverseFill(p.lat, p.lng);
    });
  } else marker.setLatLng([lat, lng]);
  if (zoom) map.setView([lat, lng], zoom);
}
function setCoords(lat, lng) { $('lat').value = (+lat).toFixed(6); $('lng').value = (+lng).toFixed(6); clearErr('f-lat'); clearErr('f-lng'); }

map.on('click', e => {
  exact = true; geoId++;
  setCoords(e.latlng.lat, e.latlng.lng); placeMarker(e.latlng.lat, e.latlng.lng);
  map.panTo(e.latlng);
  reverseFill(e.latlng.lat, e.latlng.lng);
});

function coordsTyped() {
  const lat = parseFloat($('lat').value), lng = parseFloat($('lng').value);
  if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
    exact = true; geoId++;
    placeMarker(lat, lng, Math.max(map.getZoom(), 16));
    reverseFill(lat, lng);
  }
}
$('lat').addEventListener('change', coordsTyped);
$('lng').addEventListener('change', coordsTyped);

// ---------- Helpers ----------
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Service returned ' + r.status);
  return r.json();
}
function cityFrom(a) { return a.city || a.town || a.village || a.suburb || a.county || a.state_district || a.district || ''; }
function stripCountry(name) {
  const parts = (name || '').split(', ');
  if (parts[parts.length - 1] === 'India') parts.pop();
  return parts.join(', ');
}

// Fields filled by the code are marked data-auto="1". The code may overwrite those later
// (for example when the pincode changes) but never overwrites what the person typed.
['address', 'city', 'state', 'pin'].forEach(k => {
  $(k).addEventListener('input', () => { delete $(k).dataset.auto; clearErr('f-' + k); });
});
function fillFields(o, force = false) {
  [['address', o.address], ['city', o.city], ['state', o.state], ['pin', o.pin]].forEach(([k, v]) => {
    const el = $(k);
    if (v && (force || !el.value.trim() || el.dataset.auto === '1')) { el.value = v; el.dataset.auto = '1'; clearErr('f-' + k); }
  });
}

// ---------- Reverse lookup (point -> address fields) ----------
async function reverseFill(lat, lng) {
  try {
    setStatus('Finding address for this point...');
    const d = await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${lat}&lon=${lng}`);
    const a = d.address || {};
    fillFields({ address: stripCountry(d.display_name), city: cityFrom(a), state: a.state || '', pin: (a.postcode || '').replace(/\s/g, '') }, true);
    setStatus('Address filled from the selected point.', 'ok');
  } catch (e) { setStatus('Coordinates saved, but the address could not be looked up: ' + e.message, 'error'); }
}

// ---------- Forward lookup (address / city / pincode -> point + other fields) ----------
let geoId = 0, geoTimer = null;
function scheduleGeo(ms) { clearTimeout(geoTimer); geoTimer = setTimeout(() => geoFromFields(false), ms); }

async function nominatimSearch(params) {
  const qs = new URLSearchParams({ format: 'jsonv2', addressdetails: 1, limit: 1, countrycodes: 'in', ...params });
  return getJSON('https://nominatim.openstreetmap.org/search?' + qs.toString());
}
async function photonSearch(q) {
  const j = await getJSON('https://photon.komoot.io/api/?limit=1&bbox=68.1,6.5,97.5,35.7&q=' + encodeURIComponent(q));
  return j.features.map(f => {
    const p = f.properties || {};
    return {
      lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
      address: { city: p.city || p.county || p.district, state: p.state, postcode: p.postcode },
      display_name: [p.name, p.street, p.district, p.city, p.state, p.postcode].filter(Boolean).join(', ')
    };
  });
}

async function geoFromFields(force) {
  if (exact && !force) return;
  const address = $('address').value.trim(), city = $('city').value.trim(), state = $('state').value.trim(), pin = $('pin').value.trim();
  const validPin = /^\d{6}$/.test(pin);
  if (!address && !city && !validPin) { if (force) setStatus('Enter an address, city or 6-digit pincode first.', 'error'); return; }

  const id = ++geoId;
  setStatus('Finding location...');
  const tail = [city, state, validPin ? pin : ''].filter(Boolean).join(', ');

  // Candidates from most to least precise.
  const cands = [];
  if (address) {
    cands.push({ kind: 'address', q: [address, tail].filter(Boolean).join(', ') });
    const segs = address.split(',').map(s => s.trim()).filter(Boolean);
    for (let k = 1; k <= 2 && segs.length > k; k++) cands.push({ kind: 'area', q: [segs.slice(k).join(', '), tail].filter(Boolean).join(', ') });
  }
  if (validPin) cands.push({ kind: 'pin', structured: { postalcode: pin, country: 'India' } });
  if (city) cands.push({ kind: 'city', q: [city, state].filter(Boolean).join(', ') });

  try {
    let hit = null, kind = '';
    for (let i = 0; i < cands.length && !hit; i++) {
      const c = cands[i];
      let res = await nominatimSearch(c.structured || { q: c.q });
      if (id !== geoId) return;
      if (!res.length && c.kind === 'pin') { res = await nominatimSearch({ q: pin }); if (id !== geoId) return; }
      if (!res.length && c.kind === 'address') { try { res = await photonSearch(c.q); } catch (e) {} if (id !== geoId) return; }
      if (res.length) { hit = res[0]; kind = c.kind; }
    }
    if (exact && !force) return;
    if (!hit) {
      setStatus('Could not find this on the map. Check the spelling, or click the map or drag the marker to set the location.', 'error');
      return;
    }
    const a = hit.address || {};
    fillFields({ address: stripCountry(hit.display_name), city: cityFrom(a), state: a.state || '', pin: (a.postcode || '').replace(/\s/g, '') });
    setCoords(hit.lat, hit.lon);
    placeMarker(+hit.lat, +hit.lon);
    if (kind === 'address') {
      map.setView([+hit.lat, +hit.lon], 17);
      setStatus('Location found. Drag the marker if it is not exactly right.', 'ok');
    } else {
      if (hit.boundingbox) map.fitBounds([[+hit.boundingbox[0], +hit.boundingbox[2]], [+hit.boundingbox[1], +hit.boundingbox[3]]], { maxZoom: 15 });
      else map.setView([+hit.lat, +hit.lon], kind === 'pin' ? 14 : 12);
      const what = kind === 'pin' ? 'pincode area' : kind === 'city' ? 'city' : 'nearby area';
      setStatus('Approximate location of the ' + what + '. Drag the marker or click the map for the exact spot.', 'ok');
    }
    exact = false; // still approximate: later edits may refine it
  } catch (e) {
    if (id === geoId) setStatus('Location search failed: ' + e.message + '. Check your internet connection.', 'error');
  }
}

$('findBtn').addEventListener('click', () => geoFromFields(true));

// Auto-trigger while typing
$('pin').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '');
  if (e.target.value.length === 6) scheduleGeo(300);
});
$('city').addEventListener('input', () => { if ($('city').value.trim().length >= 3) scheduleGeo(1000); });
$('state').addEventListener('input', () => { if ($('state').value.trim().length >= 3) scheduleGeo(1000); });
$('address').addEventListener('input', () => { if ($('address').value.trim().length >= 6) scheduleGeo(1400); });

// ---------- Use current location ----------
$('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { setStatus('This browser does not support location.', 'error'); return; }
  const btn = $('locBtn'); btn.disabled = true; setStatus('Getting your location...');
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude } = pos.coords;
    exact = true; geoId++;
    setCoords(latitude, longitude); placeMarker(latitude, longitude, 17);
    await reverseFill(latitude, longitude);
    btn.disabled = false;
  }, err => {
    btn.disabled = false;
    const msg = err.code === 1 ? 'Location permission was denied. Allow location for this page in the browser address bar, or type your address instead.'
      : err.code === 2 ? 'Your location is unavailable right now. Type your address instead.' : 'Getting location timed out. Try again.';
    setStatus(msg, 'error');
  }, { enableHighAccuracy: true, timeout: 15000 });
});

// ---------- Address suggestions (Photon) ----------
let sTimer = null, items = [], activeIdx = -1, sReq = 0;
function closeSuggest() { $('suggest').classList.remove('show'); activeIdx = -1; }
function fromPhoton(f) {
  const p = f.properties || {}; const [lng, lat] = f.geometry.coordinates;
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const title = p.name || street || p.city || p.state || 'Unnamed place';
  const parts = [street && street !== title ? street : '', p.district, p.city !== title ? p.city : '', p.state, p.postcode, p.country].filter(Boolean);
  const full = [...new Set([title, ...parts.filter(x => x !== 'India')])].join(', ');
  return { lat, lng, title, subtitle: [...new Set(parts)].join(', '), full, city: p.city || p.county || p.district || '', state: p.state || '', pin: (p.postcode || '').replace(/\s/g, '') };
}
function renderSuggest() {
  const box = $('suggest'); box.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button'); b.type = 'button';
    const t = document.createElement('div'); t.className = 't'; t.textContent = it.title;
    const s = document.createElement('div'); s.className = 's'; s.textContent = it.subtitle;
    b.append(t, s); b.onclick = () => pick(it); box.appendChild(b);
  });
  box.classList.toggle('show', items.length > 0);
}
async function pick(it) {
  closeSuggest(); clearTimeout(geoTimer); geoId++; exact = true;
  fillFields({ address: it.full, city: it.city, state: it.state, pin: it.pin }, true);
  setCoords(it.lat, it.lng); placeMarker(it.lat, it.lng, 17);
  if (!it.pin || !it.city || !it.state) {
    try {
      const d = await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${it.lat}&lon=${it.lng}`);
      const a = d.address || {};
      fillFields({ city: cityFrom(a), state: a.state || '', pin: (a.postcode || '').replace(/\s/g, '') });
    } catch (e) {}
  }
  setStatus('Address and coordinates filled.', 'ok');
}
async function suggest(text) {
  const id = ++sReq;
  try {
    const j = await getJSON('https://photon.komoot.io/api/?limit=6&bbox=68.1,6.5,97.5,35.7&q=' + encodeURIComponent(text));
    if (id !== sReq) return;
    items = j.features.map(fromPhoton); renderSuggest();
  } catch (e) { /* suggestions are optional; the automatic lookup still runs */ }
}
$('address').addEventListener('input', e => {
  clearTimeout(sTimer);
  const v = e.target.value.trim();
  if (v.length < 4) { items = []; closeSuggest(); return; }
  sTimer = setTimeout(() => suggest(v), 400);
});
$('address').addEventListener('keydown', e => {
  const btns = [...$('suggest').querySelectorAll('button')];
  if (!btns.length || !$('suggest').classList.contains('show')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); activeIdx = (activeIdx + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle('active', i === activeIdx));
  } else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); btns[activeIdx].click(); }
  else if (e.key === 'Escape') closeSuggest();
});
document.addEventListener('click', e => { if (!e.target.closest('#f-address')) closeSuggest(); });

// ---------- Validation, save, list ----------
['label'].forEach(k => $(k).addEventListener('input', () => clearErr('f-' + k)));

$('save').addEventListener('click', () => {
  let ok = true;
  const lat = parseFloat($('lat').value), lng = parseFloat($('lng').value);
  [['label', 'f-label'], ['address', 'f-address'], ['city', 'f-city'], ['state', 'f-state']].forEach(([k, f]) => { if (!$(k).value.trim()) { markErr(f); ok = false; } });
  if (!/^\d{6}$/.test($('pin').value)) { markErr('f-pin'); ok = false; }
  if (!(isFinite(lat) && Math.abs(lat) <= 90)) { markErr('f-lat'); ok = false; }
  if (!(isFinite(lng) && Math.abs(lng) <= 180)) { markErr('f-lng'); ok = false; }
  if (!ok) { setStatus('Fill in all required fields. Latitude and longitude fill automatically from the address, city, pincode or the map.', 'error'); return; }

  const entry = {
    id: Date.now(), label: $('label').value.trim(), address: $('address').value.trim(),
    city: $('city').value.trim(), state: $('state').value.trim(), pincode: $('pin').value,
    latitude: +lat.toFixed(6), longitude: +lng.toFixed(6), isDefault: $('isDefault').checked
  };
  if (entry.isDefault) saved.forEach(a => a.isDefault = false);
  saved.push(entry);
  persist(); renderSaved(); resetForm(); setStatus('Address saved.', 'ok');
});

function persist() { try { localStorage.setItem('addresses', JSON.stringify(saved)); } catch (e) {} }
function renderSaved() {
  $('savedWrap').style.display = saved.length ? 'block' : 'none';
  const list = $('savedList'); list.innerHTML = '';
  saved.forEach(a => {
    const row = document.createElement('div'); row.className = 'addr';
    const info = document.createElement('div');
    const b = document.createElement('b'); b.textContent = a.label; info.appendChild(b);
    if (a.isDefault) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'Default'; info.appendChild(t); }
    const p1 = document.createElement('p'); p1.textContent = `${a.address}, ${a.city}, ${a.state} - ${a.pincode}`;
    const p2 = document.createElement('p'); p2.className = 'll'; p2.textContent = `Lat ${a.latitude}, Long ${a.longitude}`;
    info.append(p1, p2);
    const del = document.createElement('button'); del.textContent = 'Delete';
    del.onclick = () => { saved = saved.filter(x => x.id !== a.id); persist(); renderSaved(); };
    row.append(info, del); list.appendChild(row);
  });
  $('json').textContent = JSON.stringify(saved, null, 2);
}
function resetForm() {
  clearTimeout(geoTimer); geoId++; exact = false;
  ['address', 'city', 'state', 'pin', 'lat', 'lng'].forEach(k => { $(k).value = ''; delete $(k).dataset.auto; });
  $('label').value = 'Home'; $('isDefault').checked = false;
  if (marker) { map.removeLayer(marker); marker = null; }
  map.setView([22.9734, 78.6569], 5);
}
function resetAll() {
  resetForm(); closeSuggest(); items = []; setStatus('');
  ['f-label', 'f-address', 'f-city', 'f-state', 'f-pin', 'f-lat', 'f-lng'].forEach(clearErr);
}
$('reset').addEventListener('click', resetAll);
$('cancel').addEventListener('click', resetAll);
renderSaved();
</script>
</body>
</html>
